<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudoku Solver</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 1px; background: #333; }
    .cell { width: 40px; height: 40px; text-align: center; font-size: 1.2rem; border: none; outline: none; }
    .cell:nth-child(3n) { border-right: 2px solid #000; }
    .cell:nth-child(9n+1) { border-left: 2px solid #000; }
    .grid > input:nth-child(n+19):nth-child(-n+27),
    .grid > input:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #000; }
    .controls { margin-top: 1rem; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin: 0 5px; }
  </style>
</head>
<body>
  <h2>Sudoku Grid</h2>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button onclick="handleSolve()">Solve</button>
    <button onclick="clearGrid()">Clear</button>
  </div>

  <script src="solver.js"></script>
  <script>
    let solverModule;
    createSolverModule().then(module => { solverModule = module; });

    const gridEl = document.getElementById('grid');
    for (let i = 0; i < 81; i++) {
      const input = document.createElement('input');
      input.className = 'cell';
      input.maxLength = 1;
      input.dataset.index = i;
      input.oninput = (e) => { e.target.value = e.target.value.replace(/[^1-9]/g, ''); };
      gridEl.appendChild(input);
    }

    function handleSolve() {
      const inputs = document.querySelectorAll('.cell');
      let puzzle = '';
      inputs.forEach(input => puzzle += (input.value || '0'));

      const result = solverModule.solvePuzzle(puzzle);
      if (result && result.length === 81) {
        inputs.forEach((input, i) => input.value = result[i]);
      }
	  else {
        alert('Invalid or unsolvable puzzle.');
      }
    }

    function clearGrid() {
      document.querySelectorAll('.cell').forEach(i => i.value = '');
    }
  </script>
</body>
</html>
